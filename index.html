<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarTalk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#03020a url("https://miro.medium.com/1*Q6k3tTOfLpNB9Sdg0C6IdQ.jpeg") no-repeat center center fixed;
background-size:cover;
color:#e5e3f0;
font-family:Verdana,Geneva,sans-serif;
min-height:100vh;
padding:50px 20px;
}
body::before{content:"";position:fixed;inset:0;
background:rgba(3,2,10,.55);
pointer-events:none;
z-index:0;}
.wrap{position:relative;z-index:2;
max-width:760px;
margin:0 auto;}

.top{display:flex;align-items:center;gap:8px;
font-size:13px;
color:#b0a8ff;letter-spacing:2px;
text-transform:uppercase;
margin-bottom:18px;}
.blip{width:8px;height:8px;
background:#6fe6a5;
border-radius:50%;
box-shadow:0 0 8px #6fe6a5;
animation:blink 1.8s ease-in-out infinite;}
.pulse-line{height:2px;
background:linear-gradient(90deg,transparent,#6fe6a5,#b0a8ff,transparent);
background-size:200% 100%;
margin-bottom:24px;
animation:slide 3s linear infinite;border-radius:2px;}
.panel{background:rgba(15,12,24,.7);
border:1px solid rgba(176,168,255,.2);
border-radius:10px;padding:24px 22px;
box-shadow:0 10px 30px rgba(0,0,0,.5);}
h1{font-family:Georgia,serif;font-size:22px;
font-weight:bold;
line-height:1.3;
margin-bottom:6px;color:#fff;}
.day{font-size:11px;color:#6fe6a5;
letter-spacing:1px;margin-bottom:18px;
text-transform:uppercase;}
img,video{width:100%;display:block;
margin-bottom:18px;
border-radius:8px;
border:1px solid rgba(176,168,255,.2);}
.blurb{font-size:14px;line-height:1.65;
color:#c3bfd6;}
.msg{text-align:center;padding:50px 15px;
color:#6fe6a5;
font-size:13px;
letter-spacing:1px;}
.msg.bad{color:#ff8fa0}
footer{margin-top:22px;font-size:11px;
color:#7a7590;
text-align:center;letter-spacing:.5px;}
footer a{color:#b0a8ff;text-decoration:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slide{
0%{background-position:200% 0}
100%{background-position:-200% 0}
}
@media (max-width:600px){
body{padding:30px 14px;background-attachment:scroll}
.panel{padding:18px 16px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="blip"></span>StarTalk</div>
<div class="pulse-line"></div>
<div class="panel">
<div id="app"></div>
</div>
<footer>
powered by NASA's APOD · built for
<a href="https://stardance.hackclub.com" target="_blank">Stardance</a>
</footer>
</div>

<script>
const app=document.getElementById("app");
const url = "https://api.nasa.gov/planetary/apod";
const key = "DEMO_KEY";

async function load(tries){
tries = tries || 2;
app.innerHTML='<div class="msg">loading today\'s picture...</div>';

try{
const r=await fetch(url + "?api_key=" + key);

if(r.status === 429){
app.innerHTML='<div class="msg bad">too many requests, give it a minute</div>';
return;
}

if(r.status >= 500 && tries > 1){
await new Promise(x=>setTimeout(x,1500));
return load(tries - 1);
}

if(!r.ok) throw new Error("nasa said " + r.status);

const d = await r.json();
draw(d);

}catch(e){
app.innerHTML='<div class="msg bad">couldn\'t load. ' + e.message + '</div>';
}
}

function draw(d){
var media;
if(d.media_type === "video"){
media = '<video src="' + d.url + '" controls></video>';
}else{
media = '<img src="' + d.url + '" alt="' + d.title + '">';
}

app.innerHTML =
'<h1>' + d.title + '</h1>' +
'<div class="day">' + d.date + '</div>' +
media +
'<p class="blurb">' + d.explanation + '</p>';
}

load();
</script>
</body>
</html>
